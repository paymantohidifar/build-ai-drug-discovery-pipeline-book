[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aiddp"
version = "0.1.0"
description = "Build AI Drug Discovery Pipeline Book By Noah Flynn"
authors = [{name = "Payman Tohidifar", email = "payman.tohidifar@gmail.com"}]
requires-python = "==3.11.*"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.1.2,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
    "scikit-learn>=1.5.1,<2.0.0",
    "matplotlib>=3.10.1,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "pixi-kernel>=0.5.1",
    "jupyter>=1.1.1,<2.0.0",
    "adjusttext>=1.3.0",
    "rdkit>=2024.3.5"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.feature.base.dependencies]
numpy = ">=2.1.2"
pandas = ">=2.2.2"
scikit-learn = ">=1.5.1"
matplotlib = ">=3.10.1"
seaborn = ">=0.13.2"
pixi-kernel = "*"
jupyter = ">=1.1.1,<2"
adjusttext = ">=1.3.0"
rdkit = ">=2024.3.5"

[tool.pixi.pypi-dependencies]
build_ai_drug_discovery_pipeline_book = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["base"], no-default-feature = false }

[tool.pixi.tasks]