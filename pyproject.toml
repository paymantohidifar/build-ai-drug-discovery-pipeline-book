[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aiddp"
version = "1.0.0"
description = "Build AI Drug Discovery Pipelines - Code and Data Repository"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    {name = "Noah Flynn"}
]
keywords = ["machine-learning", "drug-discovery", "cheminformatics", "deep-learning"]

dependencies = [
    "numpy>=1.26.4,<2.3",
    "scipy>=1.15.0",
    "pandas>=2.2.3,<3.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "rdkit>=2024.3.2",
    "scikit-learn>=1.6.0",
    "tqdm>=4.67.1",
    "joblib>=1.4.0",
    "jupyterlab>=4.5.9",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

[project.optional-dependencies]
advanced = [
    "catboost>=1.2.7",
    "lightgbm>=4.6.0",
    "xgboost>=2.1.4",
    "torch>=2.10.0",
    "torch-geometric>=2.6.1",
    "shap>=0.46.0",
    "umap-learn>=0.5.7",
    "numba>=0.60.0",
    "minisom>=2.3.5",
    "scikit-multilearn>=0.2.0",
    "statsmodels>=0.14.4",
    "imbalanced-learn>=0.13.0",
    "plotly>=5.24.1",
    "py3Dmol>=2.4.2",
    "selfies>=2.1.2",
    "SmilesPE>=0.0.3",
    "dimorphite-dl>=2.0.0",
    "tensorboard>=2.18.0",
    "networkx>=3.4.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pyyaml>=6.0.2",
]

ch12 = [
    "transformers>=4.44.0",
    "biopython>=1.83",
    "pyarrow>=23.0.1",
    "cmocean>=4.0.3",
    "ipywidgets>=8.1.0",
]

full = [
    "aiddp[advanced]",
    "openbabel-wheel>=3.1.1",
    "mdtraj>=1.10.2",
    "prolif>=2.0.3",
    "gemmi>=0.7.0",
    "meeko>=0.5.0",
]

dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "jupytext>=1.16.0",
    "nbconvert>=7.16.0",
]

# ==============================================================================
# Pixi Configuration
# ==============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

# Base environment features (corresponds to core project.dependencies)
[tool.pixi.feature.base.dependencies]
numpy = ">=1.26.4,<2.3"
scipy = ">=1.15.0"
pandas = ">=2.2.3,<3.0"
matplotlib = ">=3.10.0"
seaborn = ">=0.13.2"
rdkit = ">=2024.3.2"
scikit-learn = ">=1.6.0"
tqdm = ">=4.67.1"
joblib = ">=1.4.0"
jupyterlab = ">=4.5.9"
ipykernel = ">=6.29.0"
ipywidgets = ">=8.1.0"

# Advanced ML/DL Feature
[tool.pixi.feature.advanced.dependencies]
catboost = ">=1.2.7"
lightgbm = ">=4.6.0"
xgboost = ">=2.1.4"
pytorch = ">=2.10.0"
shap = ">=0.46.0"
umap-learn = ">=0.5.7"
numba = ">=0.60.0"
statsmodels = ">=0.14.4"
imbalanced-learn = ">=0.13.0"
plotly = ">=5.24.1"
pyyaml = ">=6.0.2"
networkx = ">=3.4.2"
openpyxl = ">=3.1.5"
xlrd = ">=2.0.1"

[tool.pixi.feature.advanced.pypi-dependencies]
minisom = ">=2.3.5"
scikit-multilearn = ">=0.2.0"
py3Dmol = ">=2.4.2"
selfies = ">=2.1.2"
SmilesPE = ">=0.0.3"
dimorphite-dl = ">=2.0.0"
tensorboard = ">=2.18.0"

# Chapter 12 Notebooks Feature
[tool.pixi.feature.ch12.dependencies]
transformers = ">=4.44.0"
biopython = ">=1.83"
pyarrow = ">=23.0.1"
cmocean = ">=4.0.3"

# Chapter 9 Docking/MD Feature (Includes Conda-Only Molecular Dynamics Binaries)
[tool.pixi.feature.ch9-docking.dependencies]
openbabel = ">=3.1.1"
mdtraj = ">=1.10.2"
prolif = ">=2.0.3"
gemmi = ">=0.7.0"
meeko = ">=0.5.0"
# Native Conda-only tools integrated seamlessly via Pixi
openmm = "*"
pdbfixer = "*"
vina = "*"

# Developer & QA Tooling Feature
[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0.0"
black = ">=24.0.0"
ruff = ">=0.6.0"
jupytext = ">=1.16.0"
nbconvert = ">=7.16.0"

[tool.pixi.pypi-dependencies]
aiddp = { path = ".", editable = true }

# ==============================================================================
# Pixi Environments
# ==============================================================================

[tool.pixi.environments]
default = { features = ["base"], no-default-feature = false }
dev = { features = ["base", "dev"], no-default-feature = false }
advanced = { features = ["base", "advanced"], no-default-feature = false }
ch12 = { features = ["base", "ch12"], no-default-feature = false }
ch9-docking = { features = ["base", "ch9-docking"], no-default-feature = false }
full = { features = ["base", "advanced", "ch12", "ch9-docking", "dev"], no-default-feature = false }

[tool.pixi.tasks]