[project]
authors = [{name = "Payman Tohidifar", email = "payman.tohidifar@gmail.com"}]
dependencies = []
name = "aiddp"
description = "Build AI Drug Discovery Pipeline Book By Noah Flynn"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
build_ai_drug_discovery_pipeline_book = { path = ".", editable = true }

